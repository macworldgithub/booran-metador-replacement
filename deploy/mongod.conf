storage:
  dbPath: /var/lib/cranbourne-mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
net:
  bindIp: 127.0.0.1
  port: 27019
security:
  authorization: enabled
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
# Logs go to the service journal. This isolated instance does not use /var/lib/mongodb.
