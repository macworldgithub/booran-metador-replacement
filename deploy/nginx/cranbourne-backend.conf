server {
    listen 80;
    listen [::]:80;
    server_name cranbourne-backend.omnisuiteai.com www.cranbourne-backend.omnisuiteai.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
