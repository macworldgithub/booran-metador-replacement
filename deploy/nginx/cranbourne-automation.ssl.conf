server {
    listen 80;
    listen [::]:80;
    server_name cranbourne-automation.omnisuiteai.com www.cranbourne-automation.omnisuiteai.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cranbourne-automation.omnisuiteai.com www.cranbourne-automation.omnisuiteai.com;
    ssl_certificate /etc/letsencrypt/live/cranbourne-automation.omnisuiteai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cranbourne-automation.omnisuiteai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CranbourneAutomationSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    access_log /var/log/nginx/cranbourne-automation.access.log;
    error_log /var/log/nginx/cranbourne-automation.error.log warn;
    location ~ /\. { deny all; }
    location / {
        include /etc/nginx/snippets/cranbourne-proxy.conf;
        proxy_pass http://127.0.0.1:5971;
    }
}
